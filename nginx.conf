server {
    listen 6000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dedicated route for CMU OAuth browser callback to load the SPA index.html
    location = /api/auth/callback {
        try_files /index.html =404;
    }

    # Proxy API calls with /api/ prefix stripped to Express backend
    location ^~ /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct backend routes
    location ~ ^/(auth|health|teams|categories|locations|users|uploads|cmu-oauth)(/|$) {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
